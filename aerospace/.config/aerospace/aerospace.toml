# vim:ft=toml
#
# AeroSpace -- tiling window manager for macOS.
#
# Base is AeroSpace's stock default-config.toml (trimmed to 5 workspaces),
# kept deliberately close to stock after a workspace-switch flicker
# investigation turned out to be a macOS Keyboard Shortcuts conflict
# ("Switch to Desktop N" bound to the same alt+number keys as AeroSpace's
# own bindings), not an AeroSpace or config bug -- see README.md. Customized
# beyond stock: workspace-to-monitor-force-assignment, and on-window-detected
# for app routing/layout below. No native-macOS-fullscreen tricks or other
# workarounds for the (now-understood, unrelated) flicker -- everything here
# is plain AeroSpace behavior.
# Docs: https://nikitabobko.github.io/AeroSpace/guide

config-version = 2
after-startup-command = []
start-at-login = false
auto-reload-config = false

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false

# Trimmed to the 5 workspaces actually in use (stock default lists 1-9, A-Z).
persistent-workspaces = ['1', '2', '3', '4', '5']

on-mode-changed = []

focus-follows-mouse.enabled = false

key-mapping.preset = 'qwerty'

gaps.inner.horizontal = 0
gaps.inner.vertical =   0
gaps.outer.left =       0
gaps.outer.bottom =     0
gaps.outer.top =        0
gaps.outer.right =      0

# --- The one customization: 4 workspaces on the main monitor, 1 on the
# secondary. 'main'/'secondary' resolve automatically to whatever's
# connected -- on a single-monitor machine, workspace 5's line is a no-op.
[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'main'
3 = 'main'
4 = 'main'
5 = 'secondary'

# --- Window layout -----------------------------------------------------
# Workspace layout:
#   1  main       Ghostty  -- always fullscreen
#   2  main       Cursor   -- always fullscreen
#   3  main       Firefox  -- the one exception, tiled, so it can split w/ another window
#   4  main       everything else -- floating, close to plain macOS window management
#   5  secondary  everything else -- same, floating, on the second monitor
#
# There's no "default to floating" config option (default-root-container-
# layout only takes tiles|accordion -- it's the arrangement of windows
# already tiling, not a floating/tiling switch). So instead: float
# everything unconditionally first (AeroSpace's own documented pattern for
# this), then the specific rules below pull out the exceptions. check-
# further-callbacks is required on the first rule -- without it, since it
# has no `if`, it would consume every window and nothing below it would run.
[[on-window-detected]]
check-further-callbacks = true
run = 'layout floating'

# Bundle ids below were looked up for the common macOS build of each app.
# If a rule doesn't fire, confirm the id with:
#   osascript -e 'id of app "<App Name>"'
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.mitchellh.ghostty'
run = ['move-node-to-workspace 1', 'fullscreen on']

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.todesktop.230313mzl4w4u92' # Cursor -- verify, todesktop ids can vary
run = ['move-node-to-workspace 2', 'fullscreen on']

[[on-window-detected]]
if = 'test %{app-bundle-id} = org.mozilla.firefox'
run = ['move-node-to-workspace 3', 'layout tiling']

[mode.main.binding]
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'

    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'

    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    alt-shift-semicolon = 'mode service'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']
    f = ['layout floating tiling', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']
